# zara: local resource monitoring (7d retention, set in /etc/default/prometheus)
global:
  scrape_interval: 15s
  evaluation_interval: 1m
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {instance: zara}
  - job_name: prometheus
    scrape_interval: 1m
    static_configs:
      - targets: ["127.0.0.1:9090"]
