<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);--track:var(--tg-theme-secondary-bg-color,#eee);--btn:var(--tg-theme-button-color,#2a8);--btnt:var(--tg-theme-button-text-color,#fff);--sep:var(--tg-theme-section-separator-color,#ddd)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.3 -apple-system,system-ui,sans-serif;padding:12px 14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:15px;font-weight:600}
.seg{display:flex;background:var(--track);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--fg);font:600 12px system-ui;padding:4px 8px;border-radius:6px}
.seg button.on{background:var(--btn);color:var(--btnt)}
.m{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--sep)}
.k{color:var(--hint);font-size:12px}.v{text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.v small{display:block;font-weight:400;font-size:11px;color:var(--hint)}
svg{width:100%;height:34px;display:block}
.ft{display:flex;justify-content:space-between;align-items:center;padding-top:9px}
.h{color:var(--hint);font-size:12px}
.rf{border:0;border-radius:8px;padding:6px 12px;font:600 12px system-ui;background:var(--btn);color:var(--btnt)}
button:disabled{opacity:.5}
</style></head><body>
<div class="hd"><h1>zara</h1><div class="seg" id="seg"></div></div>
<div id="rows"></div>
<div class="ft"><span class="h" id="ft"></span><button class="rf" id="rf">Refresh</button></div>
<script>
var W=window.TelegramWidget,R=['1h','6h','24h','7d'],d=null;
var M=[['c','CPU','#4f8cf7'],['m','Memory','#a35cf0'],['d','Disk','#f5a524'],['T','Temp','#e5484d'],['n','Network','#30a46c']];
var A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function dec(s){var o=[],b=0,n=0;for(var i=0;i<s.length;i++){var x=A.indexOf(s[i]);if(x<0)continue;b=(b<<6)|x;n+=6;if(n>=8){n-=8;var v=(b>>n)&255;o.push(v==255?null:v)}}return o}
function spark(v,c){var n=v.length,p='',a='',lx=null;if(n<2)return'';
 for(var i=0;i<n;i++){if(v[i]==null){lx=null;continue}var x=(i/(n-1)*100).toFixed(1),y=(32-v[i]*.3).toFixed(1);
  p+=(lx==null?'M':'L')+x+' '+y;lx=x}
 return'<svg viewBox="0 0 100 34" preserveAspectRatio="none"><path d="'+p+'" fill="none" stroke="'+c+'" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>'}
function bps(b){return b==null?'–':b>=1e6?(b/1e6).toFixed(1)+' MB/s':b>=1e3?(b/1e3).toFixed(1)+' kB/s':Math.round(b)+' B/s'}
function f(x,u){return x==null?'–':Math.round(x)+u}
function val(k,c){switch(k){
 case'c':return f(c.c,'%')+'<small>load '+(c.l==null?'–':c.l.toFixed(2))+'</small>';
 case'm':return f(c.m,'%')+'<small>'+(c.mu||0).toFixed(1)+'/'+(c.mt||0).toFixed(1)+' GB</small>';
 case'd':return f(c.d,'%')+'<small>'+(c.du||0).toFixed(1)+'/'+(c.dt||0).toFixed(1)+' GB</small>';
 case'T':return f(c.T,'°C');
 case'n':return'<span style="font-size:12px">↓'+bps(c.rx)+'<br>↑'+bps(c.tx)+'</span>'}}
function render(){
 try{d=JSON.parse(W?W.chatData:null)}catch(e){d=null}
 var seg=document.getElementById('seg');seg.innerHTML=R.map(function(r){return'<button data-r="'+r+'" class="'+(d&&d.r==r?'on':'')+'">'+r+'</button>'}).join('');
 if(!d){document.getElementById('rows').innerHTML='<p class="h">No data — tap Refresh.</p>';return}
 var h='',c=d.cur||{};
 M.forEach(function(m){if(!d.s[m[0]])return;h+='<div class="m"><span class="k">'+m[1]+(m[0]=='n'?'<br><small>max '+bps(d.nm)+'</small>':'')+'</span>'+spark(dec(d.s[m[0]]),m[2])+'<span class="v">'+val(m[0],c)+'</span></div>'});
 document.getElementById('rows').innerHTML=h;
 var a=Math.floor(Date.now()/1e3-d.t);
 document.getElementById('ft').textContent='up '+(c.up>=48?Math.floor(c.up/24)+'d':Math.floor(c.up||0)+'h')+' · updated '+(a<60?'just now':Math.floor(a/60)+' min ago');
}
function ask(q,b){b.disabled=true;W.request(q).then(function(){},function(e){b.disabled=false;document.getElementById('ft').textContent='Error: '+e.code})}
document.getElementById('seg').addEventListener('click',function(e){var r=e.target.getAttribute('data-r');if(r)ask('s:'+r,e.target)});
document.getElementById('rf').addEventListener('click',function(){ask('s:'+(d?d.r:'6h'),this)});
if(W){W.onEvent('chatDataChanged',function(){render();document.getElementById('rf').disabled=false});W.ready&&W.ready()}
render();setInterval(render,30000);
</script></body></html>
